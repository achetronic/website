{{ define "main" }}
<section class="hero">
  <img src="{{ "images/achetronic-header.png" | relURL }}"
       alt="achetronic"
       class="hero-logo"
       width="720" height="240"
       fetchpriority="high">
  <p class="hero-tagline">{{ .Site.Params.description }}</p>

  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ "/posts/" | relURL }}">leer publicaciones →</a>
  </div>
</section>

<section class="link-grid">
  {{- range .Site.Params.social }}
  {{- if ne .name "rss" }}
  <a href="{{ .url }}" rel="me noopener" target="_blank" class="link-card">
    <span class="link-card-name">{{ .name }}</span>
    <span class="link-card-url">{{ .url | replaceRE "^(https?://(www\\.)?|mailto:)" "" }}</span>
    <span class="link-card-arrow">
      <svg class="link-card-square" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="3" y="3" width="94" height="94" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
              vector-effect="non-scaling-stroke"
              pathLength="100"/>
      </svg>
      <span class="link-card-arrow-glyph">↗</span>
    </span>
  </a>
  {{- end }}
  {{- end }}
</section>
{{ end }}
